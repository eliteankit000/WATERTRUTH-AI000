services:
  - type: web
    name: watertruth-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      set -e
      pip install --upgrade pip
      pip install -r backend/requirements.txt
      npm install -g corepack && corepack enable
      cd frontend
      yarn install --frozen-lockfile || yarn install
      yarn build
    startCommand: cd backend && gunicorn server:app -c gunicorn.conf.py
    healthCheckPath: /api/health
    envVars:
      # ── REQUIRED — set in Render dashboard (Environment tab) ────────────
      - key: OPENAI_API_KEY            # OpenAI key with GPT-5.2 access
        sync: false
      - key: DATABASE_URL              # Supabase Transaction Pooler URI (port 6543)
        sync: false

      # ── Defaults (override if you want) ───────────────────────────────
      - key: OPENAI_MODEL
        value: gpt-5.2
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.11.1"
